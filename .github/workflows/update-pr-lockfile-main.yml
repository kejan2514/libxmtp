name: Update PR lockfile

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1109-replace-clap-with-lexopt
          fetch-depth: 0
      - name: Restore lockfile and resolve only the new dependency
        run: |
          git checkout a8710c7a7a87235730809ef408da2ac97b54f266 -- Cargo.lock
          cargo check -p mls_validation_service --no-default-features
      - name: Commit Cargo.lock if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already up to date"
            exit 0
          fi
          git commit -m "chore: update Cargo.lock for lexopt"
          git push origin HEAD:fix/1109-replace-clap-with-lexopt
