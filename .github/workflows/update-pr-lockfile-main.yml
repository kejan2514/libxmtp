name: Update PR lockfile

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1109-replace-clap-with-lexopt
          fetch-depth: 0
      - name: Resolve only lexopt in Cargo.lock
        run: |
          git checkout a8710c7a7a87235730809ef408da2ac97b54f266 -- Cargo.lock
          cargo update -p lexopt --precise 0.3.2
      - name: Commit Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update Cargo.lock for lexopt"
          git push origin HEAD:fix/1109-replace-clap-with-lexopt
