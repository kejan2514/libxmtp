name: Flaky Failure Watcher

# Disabled on this fork: the upstream watcher requires Anthropic secrets that are
# intentionally not configured here. Keep manual dispatch so the workflow can be
# re-enabled deliberately if those credentials are added later.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read
  id-token: write

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Investigate failure
        uses: anthropics/claude-code-action@v1.0.92
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
